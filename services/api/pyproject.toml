[project]
name = "goodgrocer-api"
version = "0.1.0"
description = "Goodgrocer backend API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi>=23,<26",
    "python-multipart>=0.0.20,<1",
    "pillow>=11,<13",
    "itsdangerous>=2.2,<3",
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
